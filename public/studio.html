<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写作后台 · Zhutingxuan 极简博客</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d9488'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24' font-weight='700'%3EZT%3C/text%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="/style.css?v=7" />
</head>
<body class="admin-fullscreen studio-page">
  <!-- 轻柔动态粒子背景 -->
  <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

  <!-- 独立全屏写作工作台 -->
  <main class="main-container">
    <div id="studio-view" class="content-container">
      <div class="empty-msg">正在进入写作后台...</div>
    </div>
  </main>

  <!-- 隐藏上传控件（封面/正文插图/头像） -->
  <input id="media-upload-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden" />

  <!-- 图片灯箱 -->
  <div id="lightbox-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="查看大图">
    <div class="lightbox-box">
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="关闭">×</button>
      <img id="lightbox-img" src="" alt="大图预览" />
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/particles.js?v=2"></script>
  <script src="/markdown.js?v=2"></script>
  <script src="/studio.js?v=1"></script>
</body>
</html>
